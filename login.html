<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in — FPAA Connect 2.0</title>
  <meta name="description" content="Sign in to FPAA Connect 2.0, the official platform of Falakata Polytechnic Alumni Association.">
  <meta name="theme-color" content="#15365F">
  <link rel="icon" type="image/png" href="assets/fpaa-icon-192.png">
  <link rel="apple-touch-icon" href="assets/fpaa-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <div class="app-bg" aria-hidden="true">
    <div class="grid-lines"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="login-page">
    <section class="login-brand">
      <img src="assets/fpaa-logo.png" alt="FPAA emblem" data-logo>
      <div>
        <div class="fn">FALAKATA POLYTECHNIC ALUMNI ASSOCIATION</div>
        <h1>FPAA Connect <span class="ver-badge">2.0</span></h1>
      </div>
      <p>Connecting the Past. Empowering the Present. Building the Future.</p>
      <div class="login-feats" id="loginFeats"></div>
    </section>

    <section class="login-side">
      <div class="login-card glass" id="loginCard" aria-live="polite"></div>
    </section>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="assertive"></div>

  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
